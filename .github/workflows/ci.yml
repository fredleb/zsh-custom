name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh
      - name: shellcheck (bash)
        run: shellcheck install.sh ci/*.sh run_once_before_*.sh
      - name: zsh syntax check
        run: |
          find . -name '*.zsh' -not -path './.git/*' -print0 | xargs -0 -r -n1 zsh -n

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no privilege escalation
        run: bash ci/check-no-privilege.sh
      - name: secret scan
        run: bash ci/check-secrets.sh

  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install antidote and starship
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            brew install antidote starship
          else
            sudo apt-get update
            sudo apt-get install -y zsh git curl
            sh -c "$(curl -fsSL https://starship.rs/install.sh)" -- -y -b "$HOME/.local/bin"
            git clone --depth=1 https://github.com/mattmc3/antidote.git "$HOME/.antidote"
            echo "ZSHRC_ANTIDOTE_PATH=$HOME/.antidote/antidote.zsh" >> "$GITHUB_ENV"
          fi
      - name: End-to-end install
        run: bash ci/test-install.sh
