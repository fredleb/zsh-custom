name: Release

# Every merge to main is a release. This creates both the git tag and the
# GitHub Release (the repo's Releases page shows Releases, not tags, so a tag
# alone does not surface a new version). Runs on push rather than on the pull
# request, so release credentials never reach pull-request code.
on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version and its changelog section
        id: version
        run: |
          version="$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md \
            | sed -E 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/')"
          if [ -z "$version" ]; then
            echo "no version heading in CHANGELOG.md (expected '## [x.y.z] - date')" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Release notes: the body of this version's section, up to the next
          # '## [' heading. Fail loudly rather than publish empty notes.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { in_section=1; next }
            in_section && /^## \[/   { exit }
            in_section               { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "changelog section for $version is empty" >&2
            exit 1
          fi

      - name: Create the tag if it does not exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            echo "tag ${tag} already exists; nothing to do"
            exit 0
          fi
          # An annotated tag records a tagger identity; the runner has none set,
          # so git would fail with "empty ident name". Use the actions bot.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${tag}" --message "Release ${tag}"
          git push origin "${tag}"
          echo "created tag ${tag}"

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "${tag}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release ${tag} already exists; updating notes"
            gh release edit "${tag}" --repo "$GITHUB_REPOSITORY" \
              --title "${tag}" --notes-file release-notes.md
          else
            gh release create "${tag}" --repo "$GITHUB_REPOSITORY" \
              --title "${tag}" --notes-file release-notes.md
            echo "created GitHub Release ${tag}"
          fi
