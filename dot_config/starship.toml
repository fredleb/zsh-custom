# zsh-custom default prompt — font-free (no Nerd Font required).
#
# Colors: the host, time, runtime and git elements use the terminal's default
# foreground so they stay readable on any background. Only the host name is
# colored, and only for remote (SSH) sessions. This matches the previous theme,
# which used the default foreground for those elements and blue for remote hosts.
#
# To override the prompt, set STARSHIP_CONFIG in ~/.config/zsh/local.zsh.

add_newline = true

# Line 1: user@host  path ............ time
# Line 2: status + character   ......... node + git (right-aligned)
format = """
${custom.username_root}${custom.username_sudo}${custom.username_plain}${custom.host_local}$hostname$directory$fill$time
$status$character """
right_format = "${custom.zsc_node}$git_branch$git_status"

# Username: root = bold red; a sudo-capable user = bold blue; otherwise bold
# white. The previous theme coloured the username blue for sudo-group members.
# "sudo-capable" covers the groups that grant root on Linux and macOS
# (sudo, wheel, admin).
[custom.username_root]
command = "id -un"
when = '[ "$(id -u)" -eq 0 ]'
style = "bold red"
shell = ["sh"]
format = "[$output]($style)@"

[custom.username_sudo]
command = "id -un"
when = '[ "$(id -u)" -ne 0 ] && id -Gn 2>/dev/null | grep -qwE "sudo|wheel|admin"'
style = "bold blue"
shell = ["sh"]
format = "[$output]($style)@"

[custom.username_plain]
command = "id -un"
when = '[ "$(id -u)" -ne 0 ] && ! (id -Gn 2>/dev/null | grep -qwE "sudo|wheel|admin")'
style = "bold white"
shell = ["sh"]
format = "[$output]($style)@"

# Remote sessions: built-in hostname shows in blue.
[hostname]
ssh_only = true
style = "bold blue"
format = "[$hostname]($style) "

# Local sessions: default foreground, not white.
[custom.host_local]
command = "hostname -s"
when = '[ -z "$SSH_CONNECTION" ]'
style = "none"
format = "[$output]($style) "

[directory]
style = "bold white"
truncation_length = 2
truncate_to_repo = false
format = "[$path]($style) "

[time]
disabled = false
style = "none"
time_format = "%T"
format = "\\[[$time]($style)\\] "

[fill]
symbol = " "

[status]
disabled = false
style = "red"
symbol = "↵ "
format = "[$symbol$status]($style) "

# No trailing space here: the format line above already adds one.
[character]
success_symbol = "[\\$](green)"
error_symbol = "[\\$](red)"
format = "[$symbol]($style)"

[custom.zsc_node]
command = "node --version 2>/dev/null"
when = "command -v node >/dev/null 2>&1"
symbol = "⬡ "
style = "none"
format = "[$symbol$output]($style) "

[git_branch]
symbol = "±"
style = "none"
format = "\\[[$symbol](bold green)[$branch]($style) "

# Colour each indicator by state, as the previous theme did.
[git_status]
style = "none"
format = "[$staged](bold green)[$modified](bold yellow)[$untracked](bold red)[$deleted](bold red)[$renamed](bold blue)[$typechanged](bold blue)[$conflicted](bold red)[$stashed](bold magenta)[$ahead_behind](bold cyan)[$up_to_date](bold green)\\] "
stashed = "≡"
ahead = "▴"
behind = "▾"
diverged = "▴▾"
conflicted = "✖"
up_to_date = "✓"
untracked = "●"
staged = "●"
modified = "●"
